<!DOCTYPE html>
<html lang="en">
    <head>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    </head>
    <body>
        <video id="video" style="display:none"></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </body>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let fruits = [];
        let prevX = 0, prevY = 0;
        let score = 0;
        let fingerX = 0, fingerY = 0;

        /* Fruit Logic*/

        function createFruit(){
            return{
                x: Math.random() * canvas.width, // random horizontal postion
                y: canvas.height + 50, // starts just below the screen
                vx: (Math.random() - 0.5) * 6, // random left/right drift
                vy: -(Math.random() * 8 + 14), // shoot upward
                radius: 40,
                sliced: false,
                color: 'green' //placeholder, to be replaced with image later
            };
        }

        function updateFruits(){
            fruits.forEach(fruit => {
                fruit.x += fruit.vx;
                fruit.y += fruit.vy;
                fruit.vy += 0.5; // gravity - fruit is pulled down every frame
            });

            // removing the fuit once it is out of frame
            fruits = fruits.filter(fruit => fruit.y < canvas.height + 100);
        }

        function drawFruits(){
            fruits.forEach(fruit => {
                if(!fruit.sliced){
                    ctx.beginPath();
                    ctx.arc(fruit.x, fruit.y, fruit.radius, 0, Math.PI * 2);
                    ctx.fillStyle = fruit.color;
                    ctx.fill();
                }
            });
        }

        // Slice detection - to check if the finger's path intersects with the fruit
        function distToSegment(px, py, ax, ay, bx, by){
            const dx = bx - ax, dy = by -ay;
            const lenSq = dx * dx + dy * dy;
            let t = ((px - ax) * dx + (py - ay) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            const nearX = ax + t * dx;
            const nearY = ay + t * dy;
            const ex = px - nearX, ey = py - nearY;
            return Math.sqrt(ex * ex + ey * ey);
        }

        function checkSlice(fingerX, fingerY){
            fruits.forEach(fruit => {
                if (!fruit.sliced) {
                    const dist = distToSegment(fruit.x, fruit.y, prevX, prevY, fingerX, fingerY);
                    if (dist < fruit.radius) {
                        fruit.sliced = true;
                        score++;
                        console.log('sliced! score: ' + score);
                    }
                }
            });

            prevX = fingerX;
            prevY = fingerY;
        }
        
        /* Hand Detection */

        // 1. render loop defined FIRST
        function renderLoop() {
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
            ctx.restore();

            updateFruits();
            drawFruits();
            checkSlice();

            requestAnimationFrame(renderLoop);
        }

        // 2. set up hands model
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
        });

        // 3. on results just draws the dot
        hands.onResults(result => {
            if (result.multiHandLandmarks && result.multiHandLandmarks[0]) {
                const tip = result.multiHandLandmarks[0][8];
                fingerX = (1 - tip.x) * canvas.width;
                fingerY = tip.y * canvas.height;

                ctx.beginPath();
                ctx.arc(x, y, 12, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
            }
        });

        // 4. start camera, then start render loop when video is ready
        const camera = new Camera(video, {
            onFrame: async () => await hands.send({ image: video }),
            width: 640,
            height: 480
        });

        camera.start();

        video.addEventListener('loadeddata', () => {
            console.log('video ready!');
            renderLoop();
            setInterval(() => fruits.push(createFruit()), 1000); // new fruits spawns every second
        
        });
    </script>
</html>
